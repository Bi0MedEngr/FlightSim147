name: Build firmware & web flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core + Arduino_GFX
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "GFX Library for Arduino"

      - name: Compile ESP32-S3 (Waveshare ESP32-S3-LCD-1.47)
        run: |
          mkdir -p out
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc" \
            --output-dir build-s3 FlightSim147
          cp build-s3/FlightSim147.ino.merged.bin out/flightsim-esp32s3.bin
          cp build-s3/FlightSim147.ino.bin out/flightsim-esp32s3-ota.bin

      - name: Compile ESP32-C6 (Waveshare ESP32-C6-LCD-1.47)
        run: |
          rm -rf c6 && cp -r FlightSim147 c6 && mv c6/FlightSim147.ino c6/c6.ino
          sed -i 's|^#define BOARD_WAVESHARE_ESP32S3_LCD_147|// #define BOARD_WAVESHARE_ESP32S3_LCD_147|; s|^// #define BOARD_WAVESHARE_ESP32C6_LCD_147|#define BOARD_WAVESHARE_ESP32C6_LCD_147|' c6/c6.ino
          arduino-cli compile --fqbn "esp32:esp32:esp32c6:CDCOnBoot=cdc" \
            --output-dir build-c6 c6
          cp build-c6/c6.ino.merged.bin out/flightsim-esp32c6.bin
          cp build-c6/c6.ino.bin out/flightsim-esp32c6-ota.bin

      - name: Assemble web flasher site
        run: |
          mkdir -p site
          cp web/* site/
          cp out/*.bin site/
          cp preview.png site/
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/" site/manifest.json

      - name: Publish "latest" release with .bin files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/*.bin --title "Latest build (${GITHUB_SHA::7})" \
            --notes "flightsim-<chip>.bin: full image, flash at 0x0 (USB / web flasher). flightsim-<chip>-ota.bin: upload through the on-device Wi-Fi updater (hold BOOT 4 s)." --target "$GITHUB_SHA"

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
